<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Interactive course</title>

		<!-- Fonts from the project theme (Rubik / Work Sans) + Tajawal for Arabic. System fonts are used offline. -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Work+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">

		<link rel="stylesheet" href="css/reset.css">
		<link rel="stylesheet" href="css/reveal.css">
		<link rel="stylesheet" href="css/elearning.css">
	</head>
	<body>
		<!--
			Interactive course player (ELS). The course is described as JSON in
			courses/<name>.js (created with author.html). Open course.html?course=sample-ar
			for the Arabic sample. Exported SCORM packages use the same player.
		-->
		<div class="reveal">
			<div class="slides"></div>
		</div>

		<script src="js/reveal.js"></script>
		<script src="js/els/core.js"></script>
		<script src="js/els/scorm.js"></script>
		<script src="js/els/types/content.js"></script>
		<script src="js/els/types/assessment.js"></script>
		<script src="js/els/types/interactive.js"></script>
		<script src="js/els/types/scenarios.js"></script>
		<script src="js/els/types/games.js"></script>
		<script src="js/els/types/advanced.js"></script>
		<script src="js/els/player.js"></script>
		<script src="courses/sample-en.js"></script>
		<script>ELS.boot();</script>
	</body>
</html>
